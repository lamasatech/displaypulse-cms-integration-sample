name: Bug in the sample
description: Something in this sample's code doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Never paste your site token, logs that contain a token, device names, customer data or anything you wouldn't want public. For account or device problems, contact your LamasaTech account manager instead.
  - type: input
    id: version
    attributes:
      label: Sample version
      description: From the release you installed, or the commit you built.
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version of the device
      placeholder: Android 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Save and check with host 127.0.0.1
        2. Start play
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: The sample's log (optional)
      description: Copy the relevant lines from the Log section. Remove any token first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed tokens, device names and customer data from this issue.
          required: true
